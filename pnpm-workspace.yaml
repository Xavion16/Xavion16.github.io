packages:
  - "apps/**"
  - "!apps/backend/.medusa/**"
  - "packages/*"
  - "infra/db"
  - "e2e"

# pnpm 11+
allowBuilds:
  "@embedded-postgres/windows-x64": true
  "@medusajs/telemetry": true
  "@swc/core": true
  esbuild: true
  msgpackr-extract: true
  unrs-resolver: true
  protobufjs: false

# pnpm 10.x
onlyBuiltDependencies:
  - "@medusajs/telemetry"

# pnpm 12 artık package.json içindeki "pnpm" alanını okumuyor (DECISIONS #006)
overrides:
  "@types/react": "19.0.5"
  "@types/react-dom": "19.0.5"
  "tsconfig-paths": "^4.2.0"
